<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - Peak Agent</title>
  <style>
    :root {
      --primary: #39225F;
      --accent: #D4AF37;
      --text: #1F2937;
      --text-muted: #6B7280;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --border: #E5E7EB;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 40px 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, #20113A 100%);
      color: #FFFFFF;
      padding: 48px 40px 40px;
      text-align: center;
      position: relative;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .header p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }
    .content {
      padding: 40px;
    }
    .content h2 {
      color: var(--primary);
      font-size: 22px;
      margin: 32px 0 12px;
      font-weight: 700;
      border-bottom: 2px solid #F3F4F6;
      padding-bottom: 8px;
    }
    .content h3 {
      font-size: 17px;
      font-weight: 600;
      margin: 20px 0 8px;
      color: #374151;
    }
    .content p, .content ul, .content ol {
      margin-bottom: 16px;
      font-size: 15px;
      color: #374151;
    }
    .content ul, .content ol {
      padding-left: 24px;
    }
    .content li {
      margin-bottom: 6px;
    }
    .content strong {
      color: #111827;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 24px 40px;
      background: #F9FAFB;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .nav-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .nav-links a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      padding: 24px 40px;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
      }
      .header {
        padding: 32px 20px;
      }
      .header h1 {
        font-size: 24px;
      }
      .content {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="brand-logo">P</div>
        <div class="brand-name">Peak Agent</div>
      </div>
      <h1>{{ title }}</h1>
      <p>Last updated: {{ updated_at|date:"F d, Y" }}</p>
    </div>

    <div class="content">
      {% if content %}
        {{ content|safe }}
      {% else %}
        {{ default_content|safe }}
      {% endif %}
    </div>

    <div class="nav-links">
      <a href="/legal/privacy/">Privacy Policy</a>
      <span>•</span>
      <a href="/legal/terms/">Terms of Service</a>
      <span>•</span>
      <a href="mailto:support@peak-agent.app">Contact Support</a>
    </div>

    <div class="footer">
      &copy; {% now "Y" %} Peak Agent. All rights reserved.
    </div>
  </div>
</body>
</html>
